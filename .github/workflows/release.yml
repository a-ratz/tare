# Release: a tag v<version> builds tare-cli, installs the built wheel and runs it, publishes it
# to PyPI, installs it from there and runs it, and creates a GitHub release. Publishing uses
# trusted publishing (OIDC), so no PyPI token is stored anywhere. pypi.org needs a trusted
# publisher for this repository and this workflow file (release.yml).
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv tags full versions only, there is no v10
        with:
          python-version: "3.13"
      - name: The tag matches the version in pyproject.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, pyproject.toml $version"; exit 1; }
      - run: uv sync --frozen
      - run: uv run pytest
      - run: uv build
      - name: The packages hold only tare's files
        run: |
          if tar tzf dist/*.tar.gz | grep -E 'experiments/|markers\.local|/runs/'; then exit 1; fi
      - name: The built wheel installs and runs
        run: uv tool run --from dist/*.whl tare --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv publish --trusted-publishing always dist/*
      - name: Install from PyPI and run it
        run: |
          # PyPI's index can lag minutes behind the upload, and uv would answer every later try
          # from the stale page it cached on the first one. So each try skips uv's cache.
          for _ in $(seq 20); do
            uv tool run --no-cache --from "tare-cli==${GITHUB_REF_NAME#v}" tare --version && exit 0
            sleep 30
          done
          exit 1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
