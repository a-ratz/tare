# Release: a tag v<version> builds tare-cli, publishes it to TestPyPI, installs it from there
# and runs it, then publishes it to PyPI and creates a GitHub release. Publishing uses trusted
# publishing (OIDC), so no PyPI token is stored anywhere. pypi.org and test.pypi.org each need a
# trusted publisher for this repository, this workflow file (release.yml) and its environment
# (pypi or testpypi).
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv tags full versions only, there is no v10
        with:
          python-version: "3.13"
      - name: The tag matches the version in pyproject.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, pyproject.toml $version"; exit 1; }
      - run: uv sync --frozen
      - run: uv run pytest
      - run: uv build
      - name: The packages hold only tare's files
        run: |
          if tar tzf dist/*.tar.gz | grep -E 'experiments/|markers\.local|/runs/'; then exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv publish --publish-url https://test.pypi.org/legacy/ --trusted-publishing always dist/*
      - name: Install from TestPyPI and run it
        run: |
          for _ in 1 2 3 4 5 6; do
            uv tool run --default-index https://test.pypi.org/simple/ --from "tare-cli==${GITHUB_REF_NAME#v}" \
              tare --version && exit 0
            sleep 20  # a new release takes a moment to appear in the index
          done
          exit 1

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv publish --trusted-publishing always dist/*

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
