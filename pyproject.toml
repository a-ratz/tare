[project]
name = "tare-cli"
version = "0.1.0"
description = "Prove your coding agent starts without your personal setup before you measure it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andre Ratzenberger" }]
keywords = ["ai-agents", "agent-evaluation", "evals", "llm-evaluation", "sandbox", "claude-code", "codex", "coding-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/a-ratz/tare"
Repository = "https://github.com/a-ratz/tare"
Issues = "https://github.com/a-ratz/tare/issues"
Concept = "https://github.com/a-ratz/tare/blob/main/CONCEPT.md"

[project.scripts]
tare = "tare.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tare"]

# An allowlist: hatchling reads only the top-level .gitignore, so the measurement data that
# experiments/*/.gitignore keeps out of git (runs, markers.local.json) would land in the sdist.
[tool.hatch.build.targets.sdist]
only-include = ["src/tare", "tests", "README.md", "CONCEPT.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
