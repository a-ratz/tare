[project]
name = "tare-cli"
version = "0.1.0"
description = "Start a coding agent in a room where nothing of yours came along, and prove it before the run."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tare = "tare.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tare"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
