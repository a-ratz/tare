<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tare · all runs</title>
<link rel="stylesheet" href="/assets/tare.css">
<link rel="icon" href="/assets/logo-light.svg">
<script>
(() => {
  const dark = matchMedia("(prefers-color-scheme: dark)");
  const apply = () => document.documentElement.dataset.theme = dark.matches ? "dark" : "light";
  apply();
  dark.addEventListener("change", apply);
})();
</script>
</head>
<body class="body">
<main class="page">
  <header class="run-head">
    <img class="logo logo-light" src="/assets/logo-light.svg" alt="tare"><img class="logo logo-dark" src="/assets/logo-dark.svg" alt="tare">
    <nav class="crumbs"><span>All runs</span></nav>
    <div class="end" id="status"></div>
  </header>
  <div class="table-wrap" style="margin-top:var(--space-6)">
    <table class="table body">
      <thead class="label"><tr><th></th><th style="width:30%">Run</th><th>Answer</th><th style="width:24%">Progress</th></tr></thead>
      <tbody id="runs"><tr><td></td><td colspan="3" class="muted">Loading…</td></tr></tbody>
    </table>
  </div>
</main>
<script>
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const prose = (v) => esc(v).replace(/`([^`]+)`/g, '<span class="mono">$1</span>');
const cell = (state) => `<i class="cell${state === "failed" ? " failed" : state === "running" ? " running" : ""}"></i>`;
const MAX_CELLS = 40;  // longer runs show their count only

function row(r) {
  const done = r.phase === "done";
  const word = r.kind === "calibrate" ? "run" : "restart";
  const cells = r.cells.length <= MAX_CELLS ? r.cells.map(cell).join("") : "";
  const count = `${r.done} ${word}${r.done === 1 ? "" : "s"}${r.running ? `, ${r.running} running` : ""}`;
  return `<tr><td>${cell(done ? "passed" : "running")}</td>
    <td><a href="run/${r.i}/"><b>${esc(r.name)}</b></a><div class="caption muted clamp">tare ${esc(r.kind || "")} · ${esc(r.task || "a prompt per side")}</div></td>
    <td>${prose(r.answer)}</td>
    <td><span class="tally">${cells ? `<span class="cells">${cells}</span>` : ""}<span class="data">${count}</span></span></td></tr>`;
}
async function tick() {
  try {
    const runs = await (await fetch("runs", { cache: "no-store" })).json();
    runs.sort((a, b) => (a.phase === "done") - (b.phase === "done"));
    document.getElementById("runs").innerHTML = runs.map(row).join("");
    const live = runs.filter((r) => r.phase !== "done").length;
    document.getElementById("status").innerHTML = (live ? `<span class="status">${cell("running")}${live} running</span>` : "")
      + `<span class="data muted">${runs.length} run${runs.length === 1 ? "" : "s"}</span>`;
    if (!live) return;
  } catch (e) {
    document.getElementById("status").innerHTML = `<span class="status lost">${cell("failed")}Connection lost</span>`;
  }
  setTimeout(tick, 2000);
}
tick();
</script>
</body>
</html>
